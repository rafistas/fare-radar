<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#070a11" />
    </linearGradient>
    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="64" height="64" rx="15" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="14" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Concentric Radar Rings -->
  <circle cx="32" cy="32" r="25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" />
  <circle cx="32" cy="32" r="17" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="3 3" />
  <circle cx="32" cy="32" r="9" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Crosshairs -->
  <line x1="7" y1="32" x2="57" y2="32" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />
  <line x1="32" y1="7" x2="32" y2="57" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15" />

  <!-- Radar Sweep Sector -->
  <path d="M32 32 L32 7 A25 25 0 0 1 57 32 Z" fill="url(#radarSweep)" />
  <line x1="32" y1="32" x2="50" y2="14" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" stroke-linecap="round" />

  <!-- Radar Blip / Price Target Ping -->
  <circle cx="48" cy="18" r="5" fill="#10b981" fill-opacity="0.25" />
  <circle cx="48" cy="18" r="2.5" fill="#10b981" filter="url(#glow)" />

  <!-- Airplane Silhouette pointing northeast -->
  <g transform="translate(27, 36) rotate(45)">
    <!-- Jet shadow -->
    <path d="M0 -17 L2.5 -9 L15 1 L15 4 L2.5 1.5 L2.5 9.5 L7.5 13.5 L7.5 16 L0 14.5 L-7.5 16 L-7.5 13.5 L-2.5 9.5 L-2.5 1.5 L-15 4 L-15 1 L-2.5 -9 Z" fill="#0284c7" opacity="0.5" transform="translate(1, 1)" />
    <!-- Jet body -->
    <path d="M0 -17 L2.5 -9 L15 1 L15 4 L2.5 1.5 L2.5 9.5 L7.5 13.5 L7.5 16 L0 14.5 L-7.5 16 L-7.5 13.5 L-2.5 9.5 L-2.5 1.5 L-15 4 L-15 1 L-2.5 -9 Z" fill="url(#planeGrad)" />
  </g>
</svg>
